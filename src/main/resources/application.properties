# Exposes Actuator endpoints required for monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Prometheus endpoint
management.endpoint.prometheus.enabled=true

# Health details
management.endpoint.health.show-details=always

# Exposes endpoints required for Kubernetes probes and Prometheus scraping.
# By default, Actuator only exposes /actuator/health — prometheus is added
# explicitly, and readiness/liveness health groups are enabled for Kubernetes probes.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Configures Micrometer to generate latency histogram buckets (http_server_requests_seconds_bucket)
# required for calculating percentile metrics (histogram_quantile) such as p95 latency in Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true 
