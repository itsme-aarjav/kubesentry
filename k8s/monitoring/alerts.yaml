apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: portfolio-app-alerts
  namespace: monitoring
  labels:
    release: monitoring   # same rule as for ServiceMonitor: mandatory label
spec:
  groups:
    - name: portfolio-app.rules
      rules:
        - alert: PortfolioAppDown
          expr: up{job="portfolio-app"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "portfolio-app is down"
            description: "The portfolio-app pod is not responding for 2 minutes."

        - alert: PortfolioAppHighCpu
          expr: rate(container_cpu_usage_seconds_total{pod=~"portfolio-app.*", container="portfolio-app"}[5m]) > 0.24
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on portfolio-app"
            description: "CPU utilization > 80% of limit (0.24 cores) for 5 minutes."

        - alert: PortfolioAppHighLatency
          expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="portfolio-app"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency"
            description: "HTTP p95 request latency exceeds 1s for 5 minutes."
