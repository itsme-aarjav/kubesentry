# Prohibits deploying an image tagged 'latest' — enforces
# traceability (the exact running version must be explicitly known).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must not use the 'latest' tag (or omit the image tag)."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
