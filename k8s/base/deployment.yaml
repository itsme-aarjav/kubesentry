apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  labels:
    app: portfolio-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: portfolio-app
        azure.workload.identity/use: "true"  # Required for Workload Identity webhook injection
    spec:
      serviceAccountName: portfolio-app-sa
      containers:
        - name: portfolio-app
          # Real image (registry + tag) is injected by the environment overlay.
          image: portfolio-app
          securityContext:
            runAsNonRoot: true
            # Explicit numeric UID matching the one created in Dockerfile (adduser -u 1001).
            # Required so Kubernetes can verify the container runs non-root without relying on usernames.
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          # Resource limits: essential for predictable production scheduling
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # Spring Boot Actuator health probes:
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: portfolio-app-secrets
