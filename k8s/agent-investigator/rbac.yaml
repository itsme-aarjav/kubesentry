apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-server
  namespace: ai-agent
---
# Read-only access restricted to the "dev" namespace (where portfolio-app lives).
# Zero write verbs (create/update/patch/delete) permitted anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-mcp-reader
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-mcp-reader-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: Role
  name: k8s-mcp-reader
  apiGroup: rbac.authorization.k8s.io
---
# Read-only access to cluster nodes (necessary for cluster capacity context).
# Get/list/watch only, strictly zero access to Kubernetes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-node-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-namespace-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-namespace-reader
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-metrics-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-metrics-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-metrics-reader
  apiGroup: rbac.authorization.k8s.io
