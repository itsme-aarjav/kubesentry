apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-alerts
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/itsme-aarjav/kubesentry.git
    targetRevision: main
    path: k8s/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
