apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/itsme-aarjav/kubesentry.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      # Automatically reconciles any drift between Git and the cluster
      selfHeal: true
      # Prunes resources removed from the Git repository.
      prune: true
    syncOptions:
      - CreateNamespace=true
